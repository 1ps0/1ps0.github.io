<!-- _includes/theme-toggle.html -->
<div class="theme-toggle">
  <div class="theme-toggle-container">
    <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme">
      <span class="theme-toggle-label">Professional Mode</span>
      <span class="theme-toggle-switch">
        <span class="theme-toggle-slider"></span>
      </span>
    </button>
  </div>
  
  <div class="command-input-container">
    <input 
      type="text" 
      id="command-input" 
      class="command-input" 
      placeholder="Try commands: darkmode, lightmode, cyberpunk, professional..."
      aria-label="Command input" 
    />
    <button id="command-submit" class="command-submit">
      <i class="fas fa-terminal"></i>
    </button>
  </div>
</div>
