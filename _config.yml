title: 1ps0 | Digital Outpost
description: Exploring the digital frontier
url: https://1ps0.github.io
baseurl: ""

include: ['_pages']

default_theme: professional

# Blog post categories
category_types:
  - professional
  - creative
  - technical
  - personal

# Build settings
markdown: kramdown
permalink: /blog/:title/

collections:
  posts:
    output: true
    permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
